<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>autocrop local</title>
</head>
<body>
<h1>autocrop local</h1>
<form id="upload-form">
<label for="file">Archivo ZIP</label>
<input type="file" id="file" name="file">
<button type="submit" id="send">Enviar ZIP</button>
</form>
<div id="error" role="alert"></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="counters" role="status" aria-live="polite"></div>
<div id="current" role="status" aria-live="polite"></div>
<a id="download" hidden>Descargar resultado</a>
<script>
let pollTimer = null;
let currentJob = null;
const form = document.getElementById("upload-form");
const errorBox = document.getElementById("error");
const statusBox = document.getElementById("status");
const countersBox = document.getElementById("counters");
const currentBox = document.getElementById("current");
const downloadLink = document.getElementById("download");

function showError(message) {
  errorBox.textContent = message;
}

function stopPolling() {
  if (pollTimer !== null) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

async function poll(jobId) {
  let res;
  try {
    res = await fetch("/api/jobs/" + encodeURIComponent(jobId));
  } catch (err) {
    stopPolling();
    showError("fallo de conexión al consultar el trabajo");
    return;
  }
  if (!res.ok) {
    stopPolling();
    showError("consulta falló: " + res.status);
    return;
  }
  const data = await res.json();
  statusBox.textContent = "estado: " + data.status;
  currentBox.textContent = data.current == null ? "" : "foto actual: " + data.current;
  countersBox.textContent = "procesadas " + data.processed + "/" + data.total +
    " guardadas " + data.saved + " revisión " + data.review;
  if (data.status === "queued" || data.status === "processing") {
    return;
  }
  if (data.status === "completed") {
    stopPolling();
    downloadLink.hidden = false;
    downloadLink.href = "/api/jobs/" + encodeURIComponent(jobId) + "/result";
  } else if (data.status === "failed") {
    stopPolling();
    downloadLink.hidden = true;
    showError(data.error || "trabajo fallido");
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  stopPolling();
  showError("");
  downloadLink.hidden = true;
  statusBox.textContent = "";
  countersBox.textContent = "";
  currentBox.textContent = "";
  const input = document.getElementById("file");
  const formData = new FormData();
  formData.append("file", input.files[0]);
  let res;
  try {
    res = await fetch("/api/jobs", {method: "POST", body: formData});
  } catch (err) {
    showError("fallo de conexión al enviar el trabajo");
    return;
  }
  if (res.status === 413) {
    showError("límite excedido: el ZIP supera 500 MiB");
    return;
  }
  if (res.status === 202) {
    const data = await res.json();
    currentJob = data.job_id;
    statusBox.textContent = "trabajo aceptado: " + data.job_id + " estado: " + data.status;
    pollTimer = setInterval(() => poll(currentJob), 1000);
    poll(currentJob);
    return;
  }
  showError("envío falló: " + res.status);
});

downloadLink.addEventListener("click", async (event) => {
  event.preventDefault();
  showError("");
  let res;
  try {
    res = await fetch(downloadLink.href);
  } catch (err) {
    showError("fallo de conexión al descargar el resultado");
    return;
  }
  if (!res.ok) {
    showError("descarga falló: " + res.status);
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = currentJob + ".zip";
  anchor.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
