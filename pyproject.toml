[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocrop"
version = "0.1.0"
description = "MVP local de recorte de fotografías deportivas"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "autocrop" }]
dependencies = ["ultralytics==8.4.174", "Pillow==12.3.0", "torch==2.14.1", "torchvision==0.29.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
autocrop = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
