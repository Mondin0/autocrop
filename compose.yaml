services:
  autocrop:
    build: .
    image: autocrop:latest
    container_name: autocrop
    command: ["sleep", "infinity"]
    working_dir: /app
    user: "${AUTOCROP_UID:-1000}:${AUTOCROP_GID:-1000}"
    environment:
      HOME: /tmp/home
      XDG_CONFIG_HOME: /tmp/home/.config
      MPLCONFIGDIR: /tmp/home/.config/matplotlib
    volumes:
      - type: bind
        source: ${AUTOCROP_INPUT_DIR:-./fotos}
        target: /input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AUTOCROP_OUTPUT_DIR:-./output}
        target: /output
        bind:
          create_host_path: false
